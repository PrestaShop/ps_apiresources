services:
  _defaults:
    public: false
    autowire: true

  PrestaShop\Module\APIResources\List\ModuleQueryBuilder:
    parent: 'prestashop.core.grid.abstract_query_builder'
    autowire: true

  prestashop.core.grid.data_factory.hook:
    class: '%prestashop.core.grid.data.factory.doctrine_grid_data_factory%'
    public: true
    arguments:
      - '@prestashop.core.api.query_builder.hook'
      - '@prestashop.core.hook.dispatcher'
      - '@prestashop.core.grid.query.doctrine_query_parser'
      - 'hook'

  prestashop.core.grid.data_factory.module:
    class: PrestaShop\Module\APIResources\List\ModuleGridDataFactory
    public: true
    arguments:
      - '@PrestaShop\Module\APIResources\List\ModuleQueryBuilder'
      - '@prestashop.core.hook.dispatcher'
      - '@prestashop.core.grid.query.doctrine_query_parser'
      - 'module'

  PrestaShop\Module\APIResources\Validation\IframeValidationGroupsResolver:
    arguments:
      - '@prestashop.adapter.legacy.configuration'

  # Validates the addressFormat string on the Country API resource.
  # Delegates to the core AddressFormatCheckerInterface when present (PS 9.2+);
  # on older PrestaShop versions the alias is missing, the argument resolves
  # to null and the validator becomes a no-op (backward-compatible behavior).
  PrestaShop\Module\APIResources\Validation\Constraints\ValidAddressFormatValidator:
    autoconfigure: true
    arguments:
      $checker: '@?PrestaShop\PrestaShop\Core\Domain\Country\AddressFormat\AddressFormatCheckerInterface'

  PrestaShop\Module\APIResources\Command\GenerateApiTrackingTableCommand:
    tags:
      - { name: 'console.command' }

  # Custom normalizers for commands/queries that are very specific and cannot rely on generic solutions from the core
  PrestaShop\Module\APIResources\ApiPlatform\Normalizer\GenerateCombinationsSerializer:
    autowire: true
    autoconfigure: true
    public: false

  PrestaShop\Module\APIResources\ApiPlatform\Normalizer\GetSearchTermAliasesQuerySerializer:
    autoconfigure: true

  # See class docblock: post-processes attributes[].localizedNames on the
  # /attributes/groups-with-attributes endpoint (nested locale keys).
  PrestaShop\Module\APIResources\ApiPlatform\Normalizer\AttributeGroupWithAttributesNormalizer:
    autowire: true
    autoconfigure: true
    public: false

  # See class docblock: flattens the zone-grouped GetCarrierRanges result into the flat range list
  # taken by SetCarrierRangesCommand, so /carriers/{carrierId}/ranges reads and writes one format.
  PrestaShop\Module\APIResources\ApiPlatform\Normalizer\CarrierRangesCollectionNormalizer:
    autoconfigure: true
    public: false

  PrestaShopBundle\ApiPlatform\Serializer\CQRSApiSerializer:
    class: PrestaShop\Module\APIResources\Serializer\QueryParameterTypeCastSerializer
    decorates: 'api_platform.serializer'
    autowire: true
    arguments:
      $decorated: '@.inner'

  # Filters Admin API operations whose minVersion/maxVersion extra properties don't match the running core
  # version. On PrestaShop >= 9.2 the equivalent core decorator class exists (checked via class_exists, NOT
  # injected as a service which would create a circular reference in the decoration chain): when detected
  # this module decorator is a pure pass-through.
  # Note: module resources must declare the gating via extraProperties (['minVersion' => 'x.y.z']), NOT via
  # the named constructor arguments which only exist in the core operation classes since PrestaShop 9.2.
  # @deprecated remove together with the class once the module requires PrestaShop >= 9.2.
  PrestaShop\Module\APIResources\ApiPlatform\Metadata\Resource\Factory\CoreVersionCompatibilityMetadataCollectionFactoryDecorator:
    decorates: api_platform.metadata.resource.metadata_collection_factory
    arguments:
      $decorated: '@.inner'
